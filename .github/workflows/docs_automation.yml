name: Update Custom Block Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'marketplace/registry.json'
  workflow_dispatch:

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install beautifulsoup4

      - name: Run Documentation Updater
        run: |
          python scripts/update_docs.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add blockDocs/Blocks.html
          git commit -m "docs: auto-update Blocks.html with latest custom blocks" || echo "No changes to commit"
          git push
